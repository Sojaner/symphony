name: Plugin evals

on:
  push:
    branches: [main]
  pull_request:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run lifecycle tests
        run: python3 -m unittest discover -s plugins/symphony/tests -v

      - name: Run bounded Codex control smoke when available
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if ! command -v codex >/dev/null 2>&1; then
            echo "::notice::SKIP Codex smoke: Codex CLI is unavailable"
          elif [ -z "$OPENAI_API_KEY" ]; then
            echo "::notice::SKIP Codex smoke: OPENAI_API_KEY is unavailable"
          else
            python3 plugins/symphony/scripts/codex_smoke.py \
              --candidate-marketplace . \
              --output codex-smoke-artifacts \
              --name control-help \
              --prompt '$symphony:symphony help' \
              --expect SYMPHONY_CONTROL_HANDLED: \
              --timeout 120
          fi

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate plugin manifest
        run: claude plugin validate ./plugins/symphony

      # The model must stay in sync with the declared orchestrator in
      # plugins/symphony/evals/match-proceeds/prompt.md.
      - name: Run plugin evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          test -n "$ANTHROPIC_API_KEY" || { echo "::error::ANTHROPIC_API_KEY repository secret is not set"; exit 1; }
          claude plugin eval ./plugins/symphony \
            --trust-plugin \
            --ablation none \
            --model claude-haiku-4-5-20251001 \
            --threshold 0.9 \
            --json eval-results.json \
            --report eval-report.html \
            --keep-temp \
            --no-publish
          # Require real results even if a gated evaluator exits successfully
          # without running any cases.
          test -s eval-results.json || { echo "plugin eval produced no results (early access not enabled?)"; exit 1; }

      - name: Collect raw eval traces
        if: always()
        run: |
          for trace in /tmp/claude-eval-*/out/trace.jsonl; do
            [ -f "$trace" ] || continue
            eval_dir="${trace%/out/trace.jsonl}"
            trace_name="${eval_dir##*/}"
            mkdir -p "eval-traces/$trace_name"
            cp -- "$trace" "eval-traces/$trace_name/trace.jsonl"
          done

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-eval-results
          path: |
            eval-results.json
            eval-report.html
            eval-traces/
            codex-smoke-artifacts/
            plugins/symphony/evals/results/

  release:
    needs: eval
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create release on version change
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c "import json; print(json.load(open('plugins/symphony/.claude-plugin/plugin.json'))['version'])")
          codex_version=$(python3 -c "import json; print(json.load(open('plugins/symphony/.codex-plugin/plugin.json'))['version'])")
          [ "$version" = "$codex_version" ] || { echo "::error::Manifest versions differ: .claude-plugin $version vs .codex-plugin $codex_version"; exit 1; }
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release v$version already exists; nothing to do."
          else
            gh release create "v$version" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "v$version" --generate-notes
          fi
